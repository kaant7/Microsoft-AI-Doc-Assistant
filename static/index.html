<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft AI Documentation Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Microsoft AI Documentation Assistant</h1>
    <p>Ask anything about Microsoft Foundry Local</p>
  </header>

  <div id="messages" class="messages"></div>

  <form id="chat-form" class="chat-form">
    <input id="chat-input" type="text" placeholder="Ask a question..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
