<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Microsoft AI Documentation Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="avatar avatar-assistant">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Microsoft AI Documentation Assistant</h1>
      <p><span class="status-dot"></span>RAG Active &middot; Microsoft AI Docs</p>
    </div>
    <button id="new-chat" class="icon-btn" title="New conversation" aria-label="New conversation">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div id="messages" class="messages"></div>

  <div class="composer">
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Ask a question about the docs..." autocomplete="off" required>
      <button type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12 20 4l-6 16-2.5-7L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
    <p class="disclaimer">AI can make mistakes. Verify important information.</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
